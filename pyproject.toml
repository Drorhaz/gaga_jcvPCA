[project]
name = "gaga_jcvpca"
version = "0.1.0"
description = "Slim standalone Gaga/psilocybin JcvPCA motion-capture pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "pyarrow",
    "openpyxl",
    "pyyaml",
]

[project.optional-dependencies]
ui = ["streamlit"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
