# Naming unification.
#
# AUTHORITATIVE SOURCE OF EXERCISE IDENTITY: the `exercise_id` column in each
# segmentation workbook ({pid}_ex_segmentatios_frames.xlsx). The canonical label
# is derived as ex{exercise_id:02d}. This file does NOT hardcode the exercise set;
# it only records the well-known aliases and group mapping for display + mapping.
#
# TWO NAMESPACES (kept explicit to remove ambiguity):
#   1. task_part  -> the P in a session key {pid}_T{t}_P{part}_R{rep}. P1 = Task Part 1.
#   2. canonical  -> ex{NN} derived from the authoritative exercise_id.

# Canonical label format applied to every segmentation row.
canonical_label_format: "ex{exercise_id:02d}"

# Session-key token meanings (P = task part, not exercise).
session_key:
  pattern: "{participant}_T{timepoint}_P{task_part}_R{repetition}"
  sheet_pattern: "{participant} - T{timepoint}P{task_part}R{repetition}"
  task_part_note: "P here is the Task Part. V1 supports Task Part 1 (P1) only."

# Movement groups: contiguous exercise_id ranges (Gaga Task Part 1).
# Used for display grouping and 'combined exercise' analysis units.
movement_groups:
  Group1: {name: "Trunk sagittal movement", exercise_ids: [1, 2]}
  Group2: {name: "Upper-limb elevation and arm wave", exercise_ids: [3, 4, 5]}
  Group3: {name: "Axial rotation and reciprocal arm rotation", exercise_ids: [6, 7, 8]}
  Group4: {name: "Curvilinear exploration", exercise_ids: [9, 10, 11, 12, 13]}
  Group5: {name: "Single-leg balance with whole-body curves", exercise_ids: [14, 15]}
  Group6: {name: "Whole-body shaking / dance", exercise_ids: [16, 17]}

# Primary analysis unit for V1.
primary_group: Group4
